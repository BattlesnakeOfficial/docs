name: Update Sponsors Data

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Use SPONSORS_TOKEN for checkout so the push triggers the deploy workflow.
      # Pushes from the default GITHUB_TOKEN don't trigger other workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Requires a classic PAT with read:org + read:user scopes.
      # Fine-grained PATs and GitHub Apps don't support sponsor queries.
      # The built-in GITHUB_TOKEN has no org-level permissions either.
      - name: Fetch sponsor data
        run: node .github/scripts/update-sponsors.js
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/sponsors.json
          git diff --staged --quiet || (git commit -m "Update sponsors data" && git push)
