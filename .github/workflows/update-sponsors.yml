name: Update Sponsors Data

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at noon UTC
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Use SPONSORS_TOKEN (byte-the-bot PAT) for checkout so pushes
      # trigger CI. Pushes from the default GITHUB_TOKEN don't trigger workflows.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SPONSORS_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Requires a classic PAT with read:org + read:user scopes.
      # Fine-grained PATs and GitHub Apps don't support sponsor queries.
      # The built-in GITHUB_TOKEN has no org-level permissions either.
      - name: Fetch sponsor data
        run: node .github/scripts/update-sponsors.js
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_TOKEN }}

      - name: Create PR if data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet src/data/sponsors.json; then
            echo "No changes to sponsor data"
            exit 0
          fi

          BRANCH="automated/update-sponsors"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset branch to current main
          git checkout -B "$BRANCH"
          git add src/data/sponsors.json
          git commit -m "Update sponsors data"
          git push -f origin "$BRANCH"

          # Check for existing open PR
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #$EXISTING_PR already exists, updated branch"
          else
            gh pr create \
              --title "Update sponsors data" \
              --body "Automated daily update of GitHub Sponsors data." \
              --head "$BRANCH" \
              --base main
            gh pr merge "$BRANCH" --auto --squash
          fi
